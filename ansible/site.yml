---
- name: Configure Diary production VM
  hosts: diary
  become: true
  vars:
    app_dir: /home/azureuser/diary
    nginx_server_name: diary-api.sineops.app
    grafana_server_name: diary-grafana.sineops.app
  tasks:
    - name: Install runtime and reverse proxy packages
      ansible.builtin.apt:
        name:
          - ca-certificates
          - curl
          - docker.io
          - docker-compose-v2
          - nginx
          - certbot
          - python3-certbot-nginx
          - fail2ban
        state: present
        update_cache: true

    - name: Enable Docker
      ansible.builtin.service:
        name: docker
        state: started
        enabled: true

    - name: Add deployment user to Docker group
      ansible.builtin.user:
        name: "{{ ansible_user }}"
        groups: docker
        append: true

    - name: Create application directory
      ansible.builtin.file:
        path: "{{ app_dir }}"
        state: directory
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"
        mode: "0750"

    - name: Configure API reverse proxy
      ansible.builtin.template:
        src: templates/api.nginx.conf.j2
        dest: /etc/nginx/sites-available/diary-api
        mode: "0644"
      notify: Reload nginx

    - name: Enable API reverse proxy
      ansible.builtin.file:
        src: /etc/nginx/sites-available/diary-api
        dest: /etc/nginx/sites-enabled/diary-api
        state: link
      notify: Reload nginx

    - name: Remove default Nginx site
      ansible.builtin.file:
        path: /etc/nginx/sites-enabled/default
        state: absent
      notify: Reload nginx

    - name: Validate Nginx configuration
      ansible.builtin.command: nginx -t
      changed_when: false

    - name: Install Fail2ban scanner jail
      ansible.builtin.template:
        src: templates/fail2ban-jail.local.j2
        dest: /etc/fail2ban/jail.local
        mode: "0644"
      notify: Restart fail2ban

    - name: Install Fail2ban nginx-scanners filter
      ansible.builtin.template:
        src: templates/fail2ban-nginx-scanners.conf.j2
        dest: /etc/fail2ban/filter.d/nginx-scanners.conf
        mode: "0644"
      notify: Restart fail2ban

    - name: Enable Fail2ban
      ansible.builtin.service:
        name: fail2ban
        state: started
        enabled: true

  handlers:
    - name: Reload nginx
      ansible.builtin.service:
        name: nginx
        state: reloaded

    - name: Restart fail2ban
      ansible.builtin.service:
        name: fail2ban
        state: restarted
