# Alertmanager config. Plain defaults are committed for local testing.
# Production: the deploy workflow REWRITES this file on the VM from
# GitHub secrets (SMTP_HOST/SMTP_FROM/SMTP_USERNAME/SMTP_PASSWORD/
# ALERT_EMAIL_TO) before `docker compose up`, so real credentials are
# never committed. See .github/workflows/deploy-backend.yml.
global:
  smtp_smarthost: 'smtp.gmail.com:587'
  smtp_from: 'diary-alerts@sineops.app'
  smtp_require_tls: true

route:
  group_by: ['alertname']
  group_wait: 30s
  group_interval: 2m
  repeat_interval: 1h
  receiver: 'diary-mail'

receivers:
  - name: 'diary-mail'
    email_configs:
      - to: 'admin@example.com'
        smarthost: 'smtp.gmail.com:587'
        from: 'diary-alerts@sineops.app'
        auth_username: ''
        auth_password: ''
        require_tls: true
        send_resolved: true
