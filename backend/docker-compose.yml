services:
  redis:
    image: redis:7.4-alpine
    container_name: lifelog-redis
    restart: unless-stopped
    ports: 
       - "127.0.0.1:6379:6379"
    volumes:
       - redis_data:/data
    command: redis-server --appendonly yes
    networks:
      - lifelog-network

  backend:
    image: ${IMAGE_NAME:-ganesh594/diary-backend:latest}
    build:
      context: .
      dockerfile: Dockerfile
    container_name: lifelog-backend
    restart: unless-stopped
    ports:
     - "127.0.0.1:5000:5000"
    environment:
      - MONGO_URI=${MONGO_URI}
      - FRONTEND_URL=${FRONTEND_URL}
      - PORT=5000
      - NODE_ENV=production
      - JWT_SECRET=${JWT_SECRET}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - AWS_REGION=${AWS_REGION}
      - S3_BUCKET_NAME=${S3_BUCKET_NAME}
      - CLOUDFRONT_DOMAIN=${CLOUDFRONT_DOMAIN}
      - CLOUDFRONT_DISTRIBUTION_ID=${CLOUDFRONT_DISTRIBUTION_ID}
      - CLOUDFRONT_KEY_PAIR_ID=${CLOUDFRONT_KEY_PAIR_ID}
      - CLOUDFRONT_PRIVATE_KEY_PATH=/app/private_key.pem
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - LOCAL_MASTER_KEY=${LOCAL_MASTER_KEY}
    volumes:
      - ./private_key.pem:/app/private_key.pem:ro
      - ./logs:/app/logs
    depends_on:
      - redis
    networks:
      - lifelog-network
    healthcheck:
      # CHANGE THIS LINE:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 5
  prometheus:
    image: prom/prometheus:v2.54.0
    container_name: lifelog-prometheus
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - ./alerts.yml:/etc/prometheus/alerts.yml
      - prometheus_data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    depends_on:
      - backend
      - alertmanager
    networks:
      - lifelog-network
  alertmanager:
    image: prom/alertmanager:v0.27.0
    container_name: lifelog-alertmanager
    restart: unless-stopped
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
      - '--config.expand-env=true'
    volumes:
      - ./alertmanager.yml:/etc/alertmanager/alertmanager.yml
    ports:
      - "127.0.0.1:9093:9093"
    environment:
      - SMTP_HOST=${SMTP_HOST:-smtp.gmail.com:587}
      - SMTP_FROM=${SMTP_FROM:-diary-alerts@sineops.app}
      - SMTP_USERNAME=${SMTP_USERNAME:-}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
      - ALERT_EMAIL_TO=${ALERT_EMAIL_TO:-admin@example.com}
    networks:
      - lifelog-network
  grafana:
    image: grafana/grafana:11.1.4
    container_name: lifelog-grafana
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SERVER_ROOT_URL=https://diary-grafana.sineops.app/
      - GF_SERVER_SERVE_FROM_SUB_PATH=false
      - GF_SMTP_ENABLED=${GF_SMTP_ENABLED:-false}
      - GF_SMTP_HOST=${SMTP_HOST:-smtp.gmail.com:587}
      - GF_SMTP_USER=${SMTP_USERNAME:-}
      - GF_SMTP_PASSWORD=${SMTP_PASSWORD:-}
      - GF_SMTP_FROM_ADDRESS=${SMTP_FROM:-diary-alerts@sineops.app}
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning/datasources:/etc/grafana/provisioning/datasources
      - ./grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards
      - ./grafana/dashboards:/etc/grafana/dashboards
    depends_on:
      - prometheus
    networks:
      - lifelog-network
volumes:
   redis_data:
      driver: local
   grafana_data:
      driver: local
   prometheus_data:
      driver: local
networks:
   lifelog-network:
      driver: bridge
      
