version: '3.8'

services:
  redis:
    image: redis:alpine
    container_name: lifelog-redis
    restart: unless-stopped
    ports: 
       - "6379:6379"
    volumes:
       - redis_data:/data
    command: redis-server --appendonly yes
    networks:
      - lifelog-network

  backend:
    image: ${IMAGE_NAME:-ganesh594/diary-backend:latest}
    build:
      context: .
      dockerfile: Dockerfile
    container_name: lifelog-backend
    restart: unless-stopped
    ports:
     - "5000:5000"
    environment:
      - MONGO_URI=${MONGO_URI}
      - PORT=5000
      - NODE_ENV=production
      - JWT_SECRET=${JWT_SECRET}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - AWS_REGION=${AWS_REGION}
      - S3_BUCKET_NAME=${S3_BUCKET_NAME}
      - CLOUDFRONT_DOMAIN=${CLOUDFRONT_DOMAIN}
      - CLOUDFRONT_DISTRIBUTION_ID=${CLOUDFRONT_DISTRIBUTION_ID}
      - CLOUDFRONT_KEY_PAIR_ID=${CLOUDFRONT_KEY_PAIR_ID}
      - CLOUDFRONT_PRIVATE_KEY_PATH=/app/secrets/private_key.pem
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - LOCAL_MASTER_KEY=${LOCAL_MASTER_KEY}
    volumes:
      - ./private_key.pem:/app/secrets/private_key.pem:ro
      - ./logs:/app/logs
    depends_on:
      - redis
    networks:
      - lifelog-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 5
  prometheus:
    image: prom/prometheus:v2.54.0
    container_name: lifelog-prometheus
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"
    depends_on:
      - backend
    networks:
      - lifelog-network
  grafana:
    image: grafana/grafana:11.1.4
    container_name: lifelog-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning/datasources:/etc/grafana/provisioning/datasources
    depends_on:
      - prometheus
    networks:
      - lifelog-network
volumes:
   redis_data:
      driver: local
   grafana_data:
      driver: local
networks:
   lifelog-network:
      driver: bridge
      
