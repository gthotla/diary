version: '3.8'

services:
  redis:
    image: redis:alpine
    conatiner_name: lifelog-redis
    restart: unless-stopped
    ports: 
       - "6379:6379"
    volumes:
       - redis_data:/data
    command: redis-server --appendonly yes
    networks:
      - lifelog-network

  backend:
    build:
      context: .
      dockerfile: Dockerfile
      container_name: lifelog-backend
    restart: unless-stopped
    ports:
     - "5000:5000"
    environment:
      - MONGO_URI=${MONGO_URI}
      - PORT=5000
      - NODE_ENV=production
      - JWT_SECRET=${JWT_SECRET}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - AWS_REGION=${AWS_REGION}
      - S3_BUCKET_NAME=${S3_BUCKET_NAME}
      - CLOUDFRONT_DOMAIN=${CLOUDFRONT_DOMAIN}
      - CLOUDFRONT_DISTRIBUTION_ID=${CLOUDFRONT_DISTRIBUTION_ID}
      - CLOUDFRONT_KEY_PAIR_ID=${CLOUDFRONT_KEY_PAIR_ID}
      - CLOUDFRONT_PRIVATE_KEY_PATH=/app/secrets/private_key.pem
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - LOCAL_MASTER_KEY=${LOCAL_MASTER_KEY}
    volumes:
      - ./private_key.pem:/app/secrets/private_key.pem:ro
      - ./logs:/app/logs
    depends_on:
      - redis
    networks:
      - lifelog-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 5
volumes:
   redis_data:
      driver: local
networks:
   lifelog-network:
      driver: bridge
      
