groups:
  - name: diary-backend.rules
    interval: 15s
    rules:
      # 70% error-ratio alert: fires when >70% of requests are 5xx over 5m.
      - alert: DiaryHighErrorRatio
        expr: sum(rate(http_request_errors_total{status_code=~"5.."}[5m])) / clamp_min(sum(rate(http_requests_total[5m])), 0.0001) > 0.7
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "High 5xx error ratio (>70%) on diary-backend"
          description: "More than 70% of requests failed with 5xx over the last 5 minutes (value: {{ $value | printf \"%.2f\" }})."

      # Continuous 5xx errors: 10 or more 5xx responses within 5 minutes.
      - alert: DiaryContinuous5xx
        expr: sum(increase(http_request_errors_total{status_code=~"5.."}[5m])) >= 10
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Continuous 5xx errors on diary-backend"
          description: "{{ $value }} server errors (5xx) in the last 5 minutes."

      # Supporting signal: elevated 4xx rate (per-endpoint drilldown lives on the dashboard).
      - alert: DiaryHighClientErrors
        expr: sum(increase(http_request_errors_total{status_code=~"4.."}[5m])) >= 50
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Elevated 4xx errors on diary-backend"
          description: "{{ $value }} client errors (4xx) in the last 5 minutes."

      # Slow endpoints: p95 latency above 1s.
      - alert: DiaryHighLatency
        expr: histogram_quantile(0.95, sum by (le) (rate(http_request_duration_seconds_bucket[5m]))) > 1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High p95 latency on diary-backend"
          description: "p95 latency is {{ $value | printf \"%.2fs\" }} (threshold 1s)."
