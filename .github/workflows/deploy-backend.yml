name: Deploy Backend to Production

on:
  push:
    branches:
      - master
    paths:
      - 'backend/**'
      - '.github/workflows/deploy-backend.yml'
  workflow_dispatch:  # Manual trigger

permissions:
  contents: write
env:
  REGISTRY: docker.io
  IMAGE_NAME: ganesh594/diary-backend

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json
      - name: Install dependencies
        working-directory: ./backend
        run: npm ci
      - name: Run tests
        working-directory: ./backend
        run: npm test -- --runInBand

  deploy-production:
    needs: test
    runs-on: ubuntu-latest
    environment: production  # GitHub environment protection
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set Docker tag
        run: |
          echo "DOCKER_TAG=${GITHUB_SHA::8}" >> $GITHUB_ENV
          echo "IMAGE_FULL=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}" >> $GITHUB_ENV

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build & Push Docker Image
        working-directory: ./backend
        run: |
          IMAGE=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          TAG=${{ env.DOCKER_TAG }}
          
          echo "🐳 Building Docker image $IMAGE:$TAG"
          docker build --build-arg NODE_OPTIONS="--max-old-space-size=4096" -t $IMAGE:$TAG .
          docker tag $IMAGE:$TAG $IMAGE:latest
          
          echo "📤 Pushing Docker image..."
          docker push $IMAGE:$TAG
          docker push $IMAGE:latest
          
          echo "✅ Image pushed successfully: $IMAGE:$TAG"

      - name: Copy Config Files to VM
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USERNAME }}
          key: ${{ secrets.VM_SSH_KEY }}
          source: "backend/docker-compose.yml,backend/prometheus.yml,backend/alerts.yml,backend/alertmanager.yml,backend/grafana"
          target: "/home/azureuser/diary"
          strip_components: 1

      - name: Deploy to Production VM
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USERNAME }}
          key: ${{ secrets.VM_SSH_KEY }}
          script: |
            set -e  # Exit immediately if a command exits with a non-zero status

            cd /home/azureuser/diary
            
            # Create .env file for docker-compose
            echo "🔧 Creating environment file..."
            cat > .env << EOF
            IMAGE_NAME=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.DOCKER_TAG }}
            MONGO_URI=${{ secrets.MONGO_URI }}
            FRONTEND_URL=${{ secrets.FRONTEND_URL }}
            NODE_ENV=production
            PORT=5000
            JWT_SECRET=${{ secrets.JWT_SECRET }}
            AWS_ACCESS_KEY_ID=${{ secrets.AWS_ACCESS_KEY_ID }}
            AWS_SECRET_ACCESS_KEY=${{ secrets.AWS_SECRET_ACCESS_KEY }}
            AWS_REGION=${{ secrets.AWS_REGION }}
            S3_BUCKET_NAME=${{ secrets.S3_BUCKET_NAME }}
            CLOUDFRONT_DOMAIN=${{ secrets.CLOUDFRONT_DOMAIN }}
            CLOUDFRONT_DISTRIBUTION_ID=${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }}
            CLOUDFRONT_KEY_PAIR_ID=${{ secrets.CLOUDFRONT_KEY_PAIR_ID }}
            CLOUDFRONT_PRIVATE_KEY_PATH=/app/private_key.pem
            LOCAL_MASTER_KEY=${{ secrets.LOCAL_MASTER_KEY }}
            GRAFANA_ADMIN_USER=${{ secrets.GRAFANA_ADMIN_USER }}
            GRAFANA_ADMIN_PASSWORD=${{ secrets.GRAFANA_ADMIN_PASSWORD }}
            SMTP_HOST=${{ secrets.SMTP_HOST }}
            SMTP_FROM=${{ secrets.SMTP_FROM }}
            SMTP_USERNAME=${{ secrets.SMTP_USERNAME }}
            SMTP_PASSWORD=${{ secrets.SMTP_PASSWORD }}
            ALERT_EMAIL_TO=${{ secrets.ALERT_EMAIL_TO }}
            GF_SMTP_ENABLED=true
            EOF
            
            # Create private key file
            echo "🔑 Creating private key file..."
            echo "${{ secrets.CLOUDFRONT_PRIVATE_KEY_BASE64 }}" | base64 -d > private_key.pem
            chmod 644 private_key.pem
            
            # Docker and Compose are provisioned separately by Ansible.
            echo "🔍 Checking Docker and Docker Compose..."
            docker info >/dev/null
            docker compose version >/dev/null
            COMPOSE_CMD="docker compose"
            
            # Deploy with Docker Compose
            echo "🚀 Deploying with Docker Compose..."
            $COMPOSE_CMD pull backend
            $COMPOSE_CMD up -d backend alertmanager prometheus grafana
            
            # Wait for backend to be ready
            echo "⏳ Waiting for backend to be ready..."
            sleep 30
            
            # Health check
            echo "🏥 Running health check..."
            if curl --fail http://localhost:5000/api/health; then
              echo "✅ Health check passed!"
            else
              echo "❌ Health check failed!"
              $COMPOSE_CMD logs --tail 50 backend
              exit 1
            fi

            echo "📈 Checking metrics endpoint..."
            if curl --fail http://localhost:5000/metrics >/dev/null; then
              echo "✅ Metrics endpoint passed!"
            else
              echo "❌ Metrics endpoint failed!"
              $COMPOSE_CMD logs --tail 50 backend prometheus
              exit 1
            fi
            
            # Cleanup
            echo "🧹 Cleaning up..."
            docker system prune -f


      - name: Send Deployment Notification
        if: always()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.EMAIL_USERNAME }}
          password: ${{ secrets.EMAIL_PASSWORD }}
          subject: "🚀 Production Deployment: ${{ job.status == 'success' && '✅ SUCCESS' || '❌ FAILED' }}"
          html_body: |
            <h2>🚀 Diary Backend - Production Deployment</h2>
            
            <h3>📊 Deployment Status: <span style="color: ${{ job.status == 'success' && 'green' || 'red' }};">${{ job.status }}</span></h3>
            
            <h3>📋 Details:</h3>
            <ul>
              <li><strong>Environment:</strong> Production</li>
              <li><strong>Commit:</strong> ${{ github.sha }}</li>
              <li><strong>Branch:</strong> ${{ github.ref_name }}</li>
              <li><strong>Docker Tag:</strong> ${{ env.DOCKER_TAG }}</li>
              <li><strong>Image:</strong> ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.DOCKER_TAG }}</li>
              <li><strong>Deployed At:</strong> $(date)</li>
            </ul>
            
            <h3>🔗 Links:</h3>
            <ul>
              <li><a href="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}">View Deployment Logs</a></li>
              <li><a href="http://your-vm-ip:5000/api/health">Backend Health Check</a></li>
            </ul>
          to: ganeshthotla594@gmail.com
          from: hellchintu82@gmail.com