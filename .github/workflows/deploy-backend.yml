name: Deploy Backend to Production

on:
  push:
    branches:
      - master
    paths:
      - 'backend/**'
      - '.github/workflows/deploy-backend.yml'
  workflow_dispatch:  # Manual trigger

permissions:
  contents: write
env:
  REGISTRY: docker.io
  IMAGE_NAME: ganesh594/diary-backend

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json
      - name: Install dependencies
        working-directory: ./backend
        run: npm ci
      - name: Run tests
        working-directory: ./backend
        run: npm test || echo "No tests configured"
      - name: Lint code
        working-directory: ./backend
        run: npm run lint || echo "No linting configured"

  deploy-production:
    needs: test
    runs-on: ubuntu-latest
    environment: production  # GitHub environment protection
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set Docker tag
        run: |
          echo "DOCKER_TAG=${GITHUB_SHA::8}" >> $GITHUB_ENV
          echo "IMAGE_FULL=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}" >> $GITHUB_ENV

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build & Push Docker Image
        working-directory: ./backend
        run: |
          IMAGE=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          TAG=${{ env.DOCKER_TAG }}
          
          echo "🐳 Building Docker image $IMAGE:$TAG"
          docker build --build-arg NODE_OPTIONS="--max-old-space-size=4096" -t $IMAGE:$TAG .
          docker tag $IMAGE:$TAG $IMAGE:latest
          
          echo "📤 Pushing Docker image..."
          docker push $IMAGE:$TAG
          docker push $IMAGE:latest
          
          echo "✅ Image pushed successfully: $IMAGE:$TAG"

      - name: Copy Config Files to VM
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USERNAME }}
          key: ${{ secrets.VM_SSH_KEY }}
          source: "backend/docker-compose.yml,backend/prometheus.yml,backend/grafana"
          target: "/home/azureuser/diary"
          strip_components: 1

          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.EMAIL_USERNAME }}
          password: ${{ secrets.EMAIL_PASSWORD }}
          subject: "🚀 Production Deployment: ${{ job.status == 'success' && '✅ SUCCESS' || '❌ FAILED' }}"
          html_body: |
            <h2>🚀 Diary Backend - Production Deployment</h2>
            
            <h3>📊 Deployment Status: <span style="color: ${{ job.status == 'success' && 'green' || 'red' }};">${{ job.status }}</span></h3>
            
            <h3>📋 Details:</h3>
            <ul>
              <li><strong>Environment:</strong> Production</li>
              <li><strong>Commit:</strong> ${{ github.sha }}</li>
              <li><strong>Branch:</strong> ${{ github.ref_name }}</li>
              <li><strong>Docker Tag:</strong> ${{ env.DOCKER_TAG }}</li>
              <li><strong>Image:</strong> ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.DOCKER_TAG }}</li>
              <li><strong>Deployed At:</strong> $(date)</li>
            </ul>
            
            <h3>🔗 Links:</h3>
            <ul>
              <li><a href="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}">View Deployment Logs</a></li>
              <li><a href="http://your-vm-ip:5000/api/health">Backend Health Check</a></li>
            </ul>
          to: ganeshthotla594@gmail.com
          from: hellchintu82@gmail.com